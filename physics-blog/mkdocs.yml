\f0\fs24 \cf0 site_name: My Math & Physics Blog\
\
theme:\
  name: material\
  features:\
    - navigation.sections # Makes the sidebar look clean with course headers\
    - search.suggest\
    - search.highlight\
\
# Navigation (Maps to your folders)\
nav:\
  - Home: index.md\
  - Linear Algebra:\
    - Introduction: linear-algebra/intro.md\
  - Quantum Mechanics:\
    - The Wave Function: quantum-mechanics/wave-function.md\
\
# Enables Markdown extensions for Math, Code blocks, and Tables\
markdown_extensions:\
  - pymdownx.arithmatex:\
      generic: true\
  - tables\
  - pymdownx.highlight:\
      anchor_linenums: true\
  - pymdownx.superfences\
\
# Loads MathJax (The engine that draws the math)\
extra_javascript:\
  - javascripts/mathjax.js\
  - https://polyfill.io/v3/polyfill.min.js?features=es6\
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js}